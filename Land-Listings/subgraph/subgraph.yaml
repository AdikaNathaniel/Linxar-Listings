# =============================================================================
# The LinXar subgraph MANIFEST: what The Graph should watch
# =============================================================================
# For each contract: its address on Sepolia, the block to start from (the
# block it was deployed in, so The Graph doesn't scan millions of older
# blocks), and which EVENT should run which HANDLER function in src/.
#
# ⚠️ If you redeploy the contracts, update the addresses and startBlocks below
#    (from contracts/ignition/deployments/chain-11155111/), then redeploy
#    the subgraph.
# =============================================================================
specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  # ---------------------------------------------------------------------------
  - kind: ethereum
    name: PropertyRegistry
    network: sepolia
    source:
      address: "0x72a2A1AEe1C721C21a3Fcfe04C0B0aB49DD397B5"
      abi: PropertyRegistry
      startBlock: 11894675
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Property
        - RegistrationRequest
      abis:
        - name: PropertyRegistry
          file: ./abis/PropertyRegistry.json
      eventHandlers:
        - event: RegistrationRequested(indexed uint256,indexed address,indexed bytes32,string)
          handler: handleRegistrationRequested
        - event: RegistrationApproved(indexed uint256,indexed uint256,indexed address)
          handler: handleRegistrationApproved
        - event: RegistrationRejected(indexed uint256,indexed address,string)
          handler: handleRegistrationRejected
        - event: PropertyRegistered(indexed uint256,indexed address,indexed bytes32,string)
          handler: handlePropertyRegistered
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
      file: ./src/property-registry.ts
  # ---------------------------------------------------------------------------
  - kind: ethereum
    name: ListingBoard
    network: sepolia
    source:
      address: "0x9905754587D013dd011900D1FacC721c1f772AdF"
      abi: ListingBoard
      startBlock: 11894680
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Listing
      abis:
        - name: ListingBoard
          file: ./abis/ListingBoard.json
      eventHandlers:
        - event: ListingCreated(indexed uint256,indexed address,indexed uint256,uint8,uint8,uint8,uint256,uint32,string,string)
          handler: handleListingCreated
        - event: ListingUpdated(indexed uint256,uint8,uint256,uint32,string)
          handler: handleListingUpdated
        - event: ListingStatusChanged(indexed uint256,uint8)
          handler: handleListingStatusChanged
      file: ./src/listing-board.ts
  # ---------------------------------------------------------------------------
  - kind: ethereum
    name: Escrow
    network: sepolia
    source:
      address: "0xe876E1175502a8F7d0f7918a6214B98416a1496F"
      abi: Escrow
      startBlock: 11894685
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Deal
        - Account
      abis:
        - name: Escrow
          file: ./abis/Escrow.json
      eventHandlers:
        - event: DealOpened(indexed uint256,indexed uint256,indexed address,address,uint8,uint256)
          handler: handleDealOpened
        - event: DealAccepted(indexed uint256)
          handler: handleDealAccepted
        - event: DealCompleted(indexed uint256)
          handler: handleDealCompleted
        - event: DealRefunded(indexed uint256)
          handler: handleDealRefunded
        - event: DealDisputed(indexed uint256,indexed address)
          handler: handleDealDisputed
        - event: Withdrawal(indexed address,uint256)
          handler: handleWithdrawal
      file: ./src/escrow.ts
  # ---------------------------------------------------------------------------
  - kind: ethereum
    name: AgentBadge
    network: sepolia
    source:
      address: "0xe306229ab438109dA39c293f0f9E977c7f9B9863"
      abi: AgentBadge
      startBlock: 11894675
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Agent
      abis:
        - name: AgentBadge
          file: ./abis/AgentBadge.json
      eventHandlers:
        - event: AgentVerified(indexed address,indexed address,string)
          handler: handleAgentVerified
        - event: AgentRevoked(indexed address,indexed address)
          handler: handleAgentRevoked
      file: ./src/agent-badge.ts
